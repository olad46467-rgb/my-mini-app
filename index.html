<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">

    <title>Tap the Coin</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🪙 Tap the Coin</h1>

        <p id="playerName">Welcome!</p>

        <div class="stats">
            <div>
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>Time</span>
                <strong id="time">30</strong>
            </div>

            <div>
                <span>Best</span>
                <strong id="best">0</strong>
            </div>
        </div>

        <div id="gameArea">

            <button id="coin" onclick="tapCoin()">
                🪙
            </button>

        </div>

        <button id="startButton" onclick="startGame()">
            🚀 START GAME
        </button>

        <p id="message">
            Tap START GAME to begin!
        </p>

    </div>

    <script src="app.js"></script>

</body>
</html>
